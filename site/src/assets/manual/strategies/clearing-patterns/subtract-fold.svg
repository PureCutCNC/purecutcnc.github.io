<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" role="img" aria-labelledby="title description">
	<title id="title">How a connected subtract feature changes the cleared area</title>
	<desc id="description">A subtract feature that is not itself a target, but touches one, extends the area a pocket clears — and it does so at its own depth, so the floor comes out stepped.</desc>
	<defs>
		<pattern id="sfTarget" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
			<rect width="8" height="8" fill="#00c8ff" fill-opacity="0.13" />
			<line x1="0" y1="0" x2="0" y2="8" stroke="#00c8ff" stroke-opacity="0.5" stroke-width="2" />
		</pattern>
		<pattern id="sfSub" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
			<rect width="8" height="8" fill="#b59a3f" fill-opacity="0.16" />
			<line x1="0" y1="0" x2="0" y2="8" stroke="#b59a3f" stroke-opacity="0.55" stroke-width="2" />
		</pattern>
		<style>
			.title { font: 700 25px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e2e6; }
			.step { font: 700 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.12em; fill: #00c8ff; }
			.heading { font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
			.detail { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c6c6cf; }
			.key { font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9a9aa8; }
			.dim { font: 700 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #00c8ff; }
			.dimAmber { font: 700 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #b59a3f; }
		</style>
	</defs>

	<rect width="860" height="500" rx="24" fill="#0c0f14" />
	<rect x="1" y="1" width="858" height="498" rx="23" fill="none" stroke="#2a2a30" stroke-width="2" />
	<text class="title" x="430" y="46" text-anchor="middle">A subtract that touches a target joins the cut</text>

	<g transform="translate(36, 78)">
		<text class="step" x="0" y="0">STEP 1</text>
		<text class="heading" x="0" y="26">The target</text>
		<rect x="0" y="42" width="232" height="150" rx="4" fill="#12161d" stroke="#2a2a30" stroke-width="2" />
		<rect x="20" y="82" width="130" height="70" rx="8" fill="url(#sfTarget)" stroke="#00c8ff" stroke-width="2" />
		<text class="dim" x="85" y="122" text-anchor="middle">Z 0 → −0.25</text>
		<text class="key" x="116" y="218" text-anchor="middle">A pocket cutting one feature.</text>
	</g>

	<g transform="translate(314, 78)">
		<text class="step" x="0" y="0">STEP 2</text>
		<text class="heading" x="0" y="26">A subtract meets it</text>
		<rect x="0" y="42" width="232" height="150" rx="4" fill="#12161d" stroke="#2a2a30" stroke-width="2" />
		<rect x="20" y="82" width="130" height="70" rx="8" fill="none" stroke="#3b3b44" stroke-width="2" stroke-dasharray="4 4" />
		<circle cx="170" cy="126" r="40" fill="url(#sfSub)" stroke="#b59a3f" stroke-width="2" />
		<text class="dimAmber" x="170" y="130" text-anchor="middle">Z 0 → −0.5</text>
		<text class="key" x="116" y="218" text-anchor="middle">Not a target of its own.</text>
	</g>

	<g transform="translate(592, 78)">
		<text class="step" x="0" y="0">STEP 3</text>
		<text class="heading" x="0" y="26">What is cleared</text>
		<rect x="0" y="42" width="232" height="150" rx="4" fill="#12161d" stroke="#2a2a30" stroke-width="2" />
		<rect x="20" y="82" width="130" height="70" rx="8" fill="url(#sfTarget)" stroke="#00c8ff" stroke-width="2" />
		<circle cx="170" cy="126" r="40" fill="url(#sfSub)" stroke="#b59a3f" stroke-width="2" />
		<text class="key" x="116" y="218" text-anchor="middle">Both areas, each at its own depth.</text>
	</g>

	<text class="step" x="36" y="336">IN SECTION</text>
	<path d="M 120 356 L 200 356 L 200 384 L 480 384 L 480 408 L 680 408 L 680 356 L 740 356 L 740 424 L 120 424 Z"
		fill="#1a1f29" stroke="#5c5c68" stroke-width="2" />
	<line x1="120" y1="356" x2="200" y2="356" stroke="#9a9aa8" stroke-width="2.5" />
	<line x1="680" y1="356" x2="740" y2="356" stroke="#9a9aa8" stroke-width="2.5" />
	<line x1="200" y1="384" x2="480" y2="384" stroke="#00c8ff" stroke-width="2.5" />
	<line x1="480" y1="408" x2="680" y2="408" stroke="#b59a3f" stroke-width="2.5" />
	<text class="dim" x="340" y="376" text-anchor="middle">−0.25, from the target</text>
	<text class="dimAmber" x="580" y="400" text-anchor="middle">−0.5, from the subtract</text>

	<text class="detail" x="430" y="470" text-anchor="middle">A long chain of connected subtracts can reach the resolver's limit; when it does, the operation says so.</text>
</svg>
