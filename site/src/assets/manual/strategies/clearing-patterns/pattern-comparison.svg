<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 740" role="img" aria-labelledby="title description">
	<title id="title">The four clearing patterns compared</title>
	<desc id="description">The same pocket cleared four ways. Offset follows the wall inwards on successive rings. Parallel sweeps straight passes at the chosen angle and turns at the boundary. Seeded circles grows circles out from seed positions and then clears what is left. Trochoidal coils a dense run of narrow overlapping orbits along each offset ring. Dashed segments are the links between passes.</desc>
	<defs>
		<marker id="clArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7a5c" />
		</marker>
		<style>
			.title { font: 700 25px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e2e6; }
			.heading { font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
			.detail { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c6c6cf; }
			.key { font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9a9aa8; }
			.cut { stroke: #ff7a5c; stroke-width: 2.2; fill: none; }
			.orbit { stroke: #ff7a5c; stroke-width: 1.1; fill: none; }
			.link { stroke: #7cb8de; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
			.wall { stroke: #9a9aa8; stroke-width: 2.5; fill: #1a1f29; }
		</style>
	</defs>

