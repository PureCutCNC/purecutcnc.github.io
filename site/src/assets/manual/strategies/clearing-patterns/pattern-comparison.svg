		<path d="M 46.0 13.0 H 254.0 A 33.0 33.0 0 0 1 287.0 46.0 V 124.0 A 33.0 33.0 0 0 1 254.0 157.0 H 46.0 A 33.0 33.0 0 0 1 13.0 124.0 V 46.0 A 33.0 33.0 0 0 1 46.0 13.0 Z" class="cut" />
