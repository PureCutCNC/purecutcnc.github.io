<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" role="img" aria-labelledby="title description">
	<title id="title">One definition shared by several instances, and Make unique</title>
	<desc id="description">Above, one definition holds the shape and three placed instances share it, so editing the shape changes all three. Below, Make unique gives the third instance its own definition, leaving the other two linked to each other.</desc>
	<defs>
		<style>
			.title { font: 700 25px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e2e6; }
			.step { font: 700 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.12em; fill: #00c8ff; }
			.heading { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
			.detail { font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c6c6cf; }
			.tiny { font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9a9aa8; }
			.badge { font: 700 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0b1020; }
		</style>
	</defs>

	<rect width="860" height="560" rx="24" fill="#0c0f14" />
	<rect x="1" y="1" width="858" height="558" rx="23" fill="none" stroke="#2a2a30" stroke-width="2" />
	<text class="title" x="430" y="44" text-anchor="middle">One shape, several placements</text>

	<!-- ================= top: linked ================= -->
	<text class="step" x="36" y="80">LINKED COPIES</text>

	<g>
		<rect x="36" y="92" width="212" height="104" rx="14" fill="#1a1a1e" stroke="#3b3b44" stroke-width="2" />
		<text class="heading" x="52" y="118">Definition</text>
		<text class="tiny" x="52" y="139">profile · role · text · mesh</text>
		<path d="M 56 152 h 52 l 16 16 v 14 h -68 Z" fill="#5A8FCC" fill-opacity="0.28" stroke="#5A8FCC" stroke-width="2.5" stroke-linejoin="round" />
		<text class="tiny" x="136" y="176">the shared shape</text>
	</g>

	<g fill="none" stroke="#00c8ff" stroke-width="2.5" stroke-linecap="round">
		<path d="M 248 144 H 284" />
		<path d="M 284 115 V 247" />
		<path d="M 284 115 H 318" />
		<path d="M 284 181 H 318" />
		<path d="M 284 247 H 318" />
	</g>

	<g>
		<rect x="318" y="86" width="176" height="58" rx="12" fill="#14161c" stroke="#3b3b44" stroke-width="2" />
		<path d="M 334 102 h 30 l 10 10 v 12 h -40 Z" fill="#5A8FCC" fill-opacity="0.28" stroke="#5A8FCC" stroke-width="2" stroke-linejoin="round" />
		<text class="heading" x="392" y="112">Rect 1</text>
		<text class="tiny" x="392" y="132">Z 0.75 → 0.6</text>

		<rect x="318" y="152" width="176" height="58" rx="12" fill="#14161c" stroke="#3b3b44" stroke-width="2" />
		<path d="M 374 168 h -30 l -10 10 v 12 h 40 Z" fill="#5A8FCC" fill-opacity="0.28" stroke="#5A8FCC" stroke-width="2" stroke-linejoin="round" />
		<text class="heading" x="392" y="178">Rect 2</text>
		<text class="tiny" x="392" y="198">Z 0.75 → 0.4</text>

		<rect x="318" y="218" width="176" height="58" rx="12" fill="#14161c" stroke="#3b3b44" stroke-width="2" />
		<path d="M 334 256 h 30 l 10 -10 v -12 h -40 Z" fill="#5A8FCC" fill-opacity="0.28" stroke="#5A8FCC" stroke-width="2" stroke-linejoin="round" />
		<text class="heading" x="392" y="244">Rect 3</text>
		<text class="tiny" x="392" y="264">Z 0.5 → 0</text>
	</g>

	<text class="detail" x="530" y="134">Each instance keeps its own position,</text>
	<text class="detail" x="530" y="154">name, Z range, folder, and visibility.</text>
	<text class="detail" x="530" y="192">Editing the shape of any one of them</text>
	<text class="detail" x="530" y="212">changes all three.</text>

	<line x1="36" y1="310" x2="824" y2="310" stroke="#2a2a30" stroke-width="2" />

	<!-- ================= bottom: after Make unique ================= -->
	<text class="step" x="36" y="346">AFTER MAKE UNIQUE ON RECT 3</text>

	<g>
		<rect x="36" y="368" width="212" height="72" rx="14" fill="#1a1a1e" stroke="#3b3b44" stroke-width="2" />
		<text class="heading" x="52" y="396">Definition A</text>
		<text class="tiny" x="52" y="418">still shared by two</text>

		<rect x="36" y="468" width="212" height="56" rx="14" fill="#1a1a1e" stroke="#6ABB81" stroke-width="2" />
		<text class="heading" x="52" y="492">Definition B</text>
		<text class="tiny" x="52" y="512">new, used by one</text>
	</g>

	<g fill="none" stroke="#00c8ff" stroke-width="2.5" stroke-linecap="round">
		<path d="M 248 404 H 284" />
		<path d="M 284 378 V 430" />
		<path d="M 284 378 H 318" />
		<path d="M 284 430 H 318" />
	</g>
	<path d="M 248 496 H 318" fill="none" stroke="#6ABB81" stroke-width="2.5" stroke-linecap="round" />

	<g>
		<rect x="318" y="352" width="176" height="52" rx="12" fill="#14161c" stroke="#3b3b44" stroke-width="2" />
		<text class="heading" x="336" y="383">Rect 1</text>

		<rect x="318" y="404" width="176" height="52" rx="12" fill="#14161c" stroke="#3b3b44" stroke-width="2" />
		<text class="heading" x="336" y="435">Rect 2</text>

		<rect x="318" y="470" width="176" height="52" rx="12" fill="#14161c" stroke="#6ABB81" stroke-width="2" />
		<text class="heading" x="336" y="501">Rect 3</text>
		<rect x="404" y="484" width="76" height="24" rx="12" fill="#6ABB81" />
		<text class="badge" x="442" y="500" text-anchor="middle">unique</text>
	</g>

	<text class="detail" x="530" y="386">Rect 3 now owns its shape, so editing</text>
	<text class="detail" x="530" y="406">it no longer touches Rect 1 or Rect 2.</text>
	<text class="detail" x="530" y="464">Rect 1 and Rect 2 stay linked to each</text>
	<text class="detail" x="530" y="484">other and still change together.</text>
</svg>
