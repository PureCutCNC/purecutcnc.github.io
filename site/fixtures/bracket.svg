<?xml version="1.0" encoding="UTF-8"?>
<!-- Fixture for the manual's SVG import shots. A physical size is stated (4 x 3 in,
     viewBox in inches) so the dialog detects the source units. The shapes are chosen to
     exercise every column of the import summary: one filled outline, four filled holes
     and a filled slot nested inside it (add + subtract under Solid regions), and two
     stroke-only shapes that Auto imports as open lines. -->
<svg xmlns="http://www.w3.org/2000/svg" width="4in" height="3in" viewBox="0 0 4 3">
  <!-- Plate outline: filled, not inside anything, so it becomes the add feature. -->
  <path d="M 0.30 0.55
           A 0.25 0.25 0 0 1 0.55 0.30
           L 3.45 0.30
           A 0.25 0.25 0 0 1 3.70 0.55
           L 3.70 2.45
           A 0.25 0.25 0 0 1 3.45 2.70
           L 0.55 2.70
           A 0.25 0.25 0 0 1 0.30 2.45
           Z" fill="#b0b0b0"/>
  <!-- Four mounting holes, nested one level in: subtract features. -->
  <circle cx="0.70" cy="0.70" r="0.16" fill="#404040"/>
  <circle cx="3.30" cy="0.70" r="0.16" fill="#404040"/>
  <circle cx="0.70" cy="2.30" r="0.16" fill="#404040"/>
  <circle cx="3.30" cy="2.30" r="0.16" fill="#404040"/>
  <!-- Centre slot, also nested one level in. -->
  <path d="M 1.55 1.35 L 2.45 1.35 A 0.15 0.15 0 0 1 2.45 1.65
           L 1.55 1.65 A 0.15 0.15 0 0 1 1.55 1.35 Z" fill="#404040"/>
  <!-- Stroke only but closed: a line under Auto, a solid under Solid regions. It is
       what makes the two modes produce different summaries. -->
  <polygon points="1.45,2.05 2.05,2.05 1.75,2.50"
           fill="none" stroke="#202020" stroke-width="0.02"/>
  <!-- Stroke only and open: lines under either mode. -->
  <polyline points="0.70,1.05 1.20,1.05 1.20,1.95 0.70,1.95"
            fill="none" stroke="#202020" stroke-width="0.02"/>
  <path d="M 2.80 1.05 C 3.20 1.25, 3.20 1.75, 2.80 1.95"
        fill="none" stroke="#202020" stroke-width="0.02"/>
</svg>
